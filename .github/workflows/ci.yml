name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pest + Pint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - name: Checkout helix-compras
        uses: actions/checkout@v4
        with:
          path: comendador-compras

      # helix/foundation é dependência via *path repo* (../helix-foundation).
      # Repo PRIVADO -> o checkout precisa de um token com leitura nele. Crie um
      # secret `FOUNDATION_TOKEN` (PAT fine-grained com Contents: Read em
      # Abilioreinaldo/helix-foundation) em Settings -> Secrets do repositório.
      - name: Checkout helix-foundation (path repo)
        uses: actions/checkout@v4
        with:
          repository: Abilioreinaldo/helix-foundation
          ref: master
          token: ${{ secrets.FOUNDATION_TOKEN }}
          path: helix-foundation

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, ctype, pdo, sqlite3, pdo_sqlite, bcmath, intl, fileinfo, curl
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: comendador-compras/package-lock.json

      - name: Prepare .env
        working-directory: comendador-compras
        run: cp .env.example .env

      - name: Install PHP dependencies
        working-directory: comendador-compras
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate app key
        working-directory: comendador-compras
        run: php artisan key:generate

      - name: Build frontend assets (@vite manifest exigido nos testes de tela)
        working-directory: comendador-compras
        run: npm ci && npm run build

      - name: Check code style (Pint)
        working-directory: comendador-compras
        run: vendor/bin/pint --test

      # Não-bloqueante: reporta advisories (visibilidade) sem reprovar o build por
      # CVE de dependência sem patch disponível (ex.: PHPSpreadsheet SSRF).
      - name: Security audit (composer)
        continue-on-error: true
        working-directory: comendador-compras
        run: composer audit --no-interaction

      - name: Run tests (Pest)
        working-directory: comendador-compras
        run: php artisan test
